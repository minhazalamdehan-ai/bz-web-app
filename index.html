<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Data Entry</title>
    <!-- SheetJS CDN (Excel Export এর জন্য) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add {
            background-color: #28a745;
            color: white;
            flex: 2;
        }
        .btn-add:hover {
            background-color: #218838;
        }
        .btn-excel {
            background-color: #007bff;
            color: white;
            flex: 1;
        }
        .btn-excel:hover {
            background-color: #0069d9;
        }
        .btn-clear {
            background-color: #dc3545;
            color: white;
            flex: 1;
        }
        .btn-clear:hover {
            background-color: #c82333;
        }
        .table-container {
            margin-top: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #343a40;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trading Data Entry Form</h2>
    
    <form id="entryForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="pair">Pair Name:</label>
                <input type="text" id="pair" placeholder="e.g. EUR/USD, BTC/USDT" required>
            </div>
            <div class="form-group">
                <label for="type">Long/Short:</label>
                <select id="type" required>
                    <option value="">Select Type</option>
                    <option value="Long">Long</option>
                    <option value="Short">Short</option>
                </select>
            </div>
            <div class="form-group">
                <label for="entry">Entry Price:</label>
                <input type="number" step="any" id="entry" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="tp01">TP01:</label>
                <input type="number" step="any" id="tp01" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="sl">Stop Loss:</label>
                <input type="number" step="any" id="sl" placeholder="0.00" required>
            </div>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-add">Add Entry</button>
            <button type="button" class="btn-excel" onclick="exportToExcel()">Export to Excel</button>
            <button type="button" class="btn-clear" onclick="clearData()">Clear All Data</button>
        </div>
    </form>

    <div class="table-container">
        <h3>Saved Entries</h3>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Pair Name</th>
                    <th>Long/Short</th>
                    <th>Entry</th>
                    <th>TP01</th>
                    <th>Stop Loss</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let entries = JSON.parse(localStorage.getItem('tradeEntries')) || [];

    // আজকের তারিখ ডিফল্ট হিসেবে সেট করার জন্য
    document.getElementById('date').valueAsDate = new Date();

    // টেবিল আপডেট করা
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        entries.forEach((item) => {
            const row = `<tr>
                <td>${item.date}</td>
                <td>${item.pair}</td>
                <td>${item.type}</td>
                <td>${item.entry}</td>
                <td>${item.tp01}</td>
                <td>${item.sl}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // ফর্ম সাবমিট হ্যান্ডলার
    document.getElementById('entryForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const newEntry = {
            date: document.getElementById('date').value,
            pair: document.getElementById('pair').value,
            type: document.getElementById('type').value,
            entry: document.getElementById('entry').value,
            tp01: document.getElementById('tp01').value,
            sl: document.getElementById('sl').value
        };

        entries.push(newEntry);
        localStorage.setItem('tradeEntries', JSON.stringify(entries));
        renderTable();

        // ফর্মের মানসমূহ রিসেট (তারিখ বাদ দিয়ে)
        document.getElementById('pair').value = '';
        document.getElementById('type').value = '';
        document.getElementById('entry').value = '';
        document.getElementById('tp01').value = '';
        document.getElementById('sl').value = '';
    });

    // Excel ফাইলে এক্সপোর্ট করার ফাংশন
    function exportToExcel() {
        if (entries.length === 0) {
            alert('Export করার জন্য কোনো ডেটা নেই!');
            return;
        }

        // কাস্টম হেডার দিয়ে এক্সেল ডেটা তৈরি
        const formattedData = entries.map(item => ({
            "Date": item.date,
            "Pair Name": item.pair,
            "Long/Short": item.type,
            "Entry": item.entry,
            "TP01": item.tp01,
            "Stop Loss": item.sl
        }));

        const worksheet = XLSX.utils.json_to_sheet(formattedData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Trade_Data");

        // আজকের তারিখ অনুযায়ী ফাইল নেম তৈরি
        const fileName = `Trading_Data_${new Date().toISOString().slice(0, 10)}.xlsx`;
        XLSX.writeFile(workbook, fileName);
    }

    // সকল ডেটা মোছার ফাংশন
    function clearData() {
        if (confirm('আপনি কি নিশ্চিত যে সকল ডেটা মুছে ফেলতে চান?')) {
            entries = [];
            localStorage.removeItem('tradeEntries');
            renderTable();
        }
    }

    // পেজ লোড হওয়ার সময় আগের জমা থাকা ডেটা দেখাবে
    renderTable();
</script>

</body>
    </html>
